<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#0b1220">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="Sightline Studio">
<link rel="manifest" href="../manifest.webmanifest">
<link rel="apple-touch-icon" href="../icons/icon-180.png">
<link rel="icon" href="../icons/icon-180.png" type="image/png">
<title>Sightline Studio</title>
<link rel="stylesheet" href="../../shared/ui.css">
<style>
  /* One column of step panels; only the panels for the current state are shown. */
  .app.studio { display: flex; flex-direction: column; height: auto; min-height: 100%; max-width: 860px; margin: 0 auto; }
  .studio .panel {
    background: var(--panel); border: 1px solid var(--line); border-radius: var(--radius); padding: 14px;
  }
  .studio [hidden] { display: none !important; }
  .studio .panel .pill:not(.active) { background: var(--bg); }
  .studio .pill:disabled { opacity: .5; cursor: default; }
  .studio .panel p { margin: 0 0 10px; }
  .studio .muted { color: var(--muted); font-size: 13px; }
  .studio .row { display: flex; gap: 8px; align-items: center; flex-wrap: wrap; }
  .studio label.row input[type=range] { flex: 1; accent-color: var(--accent); }
  .studio .file-pick input[type=file] { display: block; margin: 10px 0; max-width: 100%; }
  .studio .progress { margin: 10px 0; }
  .studio .viewport { height: min(62vh, 640px); display: block; }
  .studio .viewport video, .studio .viewport canvas {
    position: absolute; inset: 0; width: 100%; height: 100%; max-width: none; max-height: none;
  }
  .studio .viewport video { object-fit: contain; }
  .studio .viewport canvas { pointer-events: none; }
  .studio .summary { list-style: none; margin: 0 0 10px; padding: 0; display: flex; flex-wrap: wrap; gap: 6px; }
  .studio .summary li {
    padding: 3px 10px; border: 1px solid var(--line); border-radius: 999px; font-size: 13px;
  }
  .studio .error-card { margin: 0; }
</style>
</head>
<body>
<div class="app studio">
  <div class="topbar">
    <h1>Sightline Studio</h1>
    <nav class="tool-switch"><a href="../yolo/" aria-current="page">YOLO</a><a href="../panorama/">Panorama</a></nav>
    <span id="clip-name" class="status"></span>
  </div>

  <div id="errors"></div>

  <section id="panel-choose" class="panel file-pick">
    <div class="section-title">Choose a clip</div>
    <p>Pick a video you already recorded. It is processed on this device; nothing is uploaded.</p>
    <input id="file" type="file" accept="video/*">
  </section>

  <section id="panel-settings" class="panel" hidden>
    <div class="section-title">Clip</div>
    <p id="clip-info" class="muted"></p>
    <div class="section-title">Confidence</div>
    <label class="row"><input id="conf" type="range" min="0.1" max="0.9" step="0.05"><span id="conf-val"></span></label>
    <div class="section-title">Input size</div>
    <div class="row">
      <button class="pill" type="button" data-size="320">320 · faster</button>
      <button class="pill" type="button" data-size="640">640 · more accurate</button>
    </div>
    <div class="section-title">Detect on</div>
    <div class="row">
      <button class="pill" type="button" data-step="1">Every frame</button>
      <button class="pill" type="button" data-step="2">Every 2nd frame</button>
    </div>
    <div class="section-title">Labels</div>
    <div class="row"><button id="labels" class="pill" type="button">Show labels</button></div>
    <div class="section-title">&nbsp;</div>
    <div class="row">
      <button id="process" class="pill active" type="button">Process</button>
      <button class="pill choose-another" type="button">Choose another clip</button>
    </div>
  </section>

  <section id="panel-processing" class="panel" hidden>
    <div class="section-title">Processing</div>
    <div class="progress"><div id="proc-bar" class="bar"></div></div>
    <p id="proc-text" class="status" aria-live="polite">Loading model…</p>
    <div class="row"><button id="proc-cancel" class="pill" type="button">Cancel</button></div>
  </section>

  <section id="panel-review" class="panel" hidden>
    <div class="viewport">
      <video id="video" playsinline controls preload="auto"></video>
      <canvas id="overlay"></canvas>
    </div>
    <div class="section-title">Detected</div>
    <ul id="summary" class="summary"></ul>
    <div id="export-progress" hidden>
      <div class="progress"><div id="exp-bar" class="bar"></div></div>
      <p id="exp-text" class="status" aria-live="polite">Exporting…</p>
    </div>
    <div class="row">
      <button id="export" class="pill active" type="button">Export MP4</button>
      <button id="exp-cancel" class="pill" type="button" hidden>Cancel export</button>
      <button id="share" class="pill active" type="button" hidden>Share…</button>
      <a id="save-file" class="pill" hidden>Save file</a>
      <button id="back" class="pill" type="button">Settings</button>
      <button class="pill choose-another" type="button">Choose another clip</button>
    </div>
  </section>

  <div class="footer-disclaimer">RESEARCH DEMO · NOT A DRIVING AID</div>
</div>
<script type="module" src="app.js"></script>
</body>
</html>
